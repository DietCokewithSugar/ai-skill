# ============================================================
# Render Blueprint — AI Skill 编排系统
# 使用方法：Render Dashboard → New → Blueprint → 选择本仓库
# 标记 sync: false 的变量不会写进仓库，需在 Render 控制台手动填写
# ============================================================

services:
  - type: web
    name: ai-skill
    runtime: docker
    # free/starter 只有 512MB 内存，JVM + Python 依赖安装会 OOM，建议 standard 起
    plan: standard
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true

    envVars:
      # ---------- JVM ----------
      # 需与 plan 的内存匹配：standard(2GB) 可用 -Xmx1024m；若降到 512MB 实例请改为 -Xmx320m
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx1024m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"

      # ---------- AI 模型（OpenAI 兼容接口）----------
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: AI_API_KEY
        sync: false          # 密钥：在控制台填写
      - key: AI_MODEL
        sync: false          # 填你账号实际可用的模型名
      - key: AI_TEMPERATURE
        value: "0.7"
      - key: AI_MAX_TOKENS
        value: "16384"
      - key: AI_TIMEOUT
        value: "300000"
      - key: AI_THINK
        value: "false"

      # ---------- 存储 ----------
      # 使用本地文件系统 + 下方挂载的持久化磁盘，不依赖任何外部服务器
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/skills

      # 如需改回外部 FTP：把 STORAGE_TYPE 设为 ftp，删除下方 disk 配置，
      # 并补充 FTP_HOST / FTP_PORT / FTP_USERNAME / FTP_PASSWORD / FTP_BASE_DIR

    # ---------- 持久化磁盘 ----------
    # 注意：持久化磁盘仅付费实例可用；未挂盘时容器文件系统是临时的，
    # 每次重新部署或实例重启都会丢失全部技能数据。
    # 挂盘后该服务无法多实例扩容，且部署时会有短暂停机。
    disk:
      name: skill-data
      mountPath: /var/data
      sizeGB: 5
