# ============================================================
# Render Blueprint — AI Skill 编排系统
# 使用方法：Render Dashboard → New → Blueprint → 选择本仓库
# 标记 sync: false 的变量不会写进仓库，需在 Render 控制台手动填写
# ============================================================

services:
  - type: web
    name: ai-skill
    runtime: docker
    # free/starter 只有 512MB 内存，JVM + Python 依赖安装会 OOM，建议 standard 起
    plan: standard
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true

    envVars:
      # ---------- JVM ----------
      # 需与 plan 的内存匹配：standard(2GB) 可用 -Xmx1024m；若降到 512MB 实例请改为 -Xmx320m
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx1024m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"

      # ---------- AI 模型（OpenAI 兼容接口）----------
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: AI_API_KEY
        sync: false          # 密钥：在控制台填写
      - key: AI_MODEL
        sync: false          # 填你账号实际可用的模型名
      - key: AI_TEMPERATURE
        value: "0.7"
      - key: AI_MAX_TOKENS
        value: "16384"
      - key: AI_TIMEOUT
        value: "300000"
      - key: AI_THINK
        value: "false"

      # ---------- FTP 存储 ----------
      # 必须指向一台 Render 可从公网访问的 FTP 服务器：
      #   1) vsftpd 的 PASV_ADDRESS 要设为该服务器的公网 IP，否则被动模式握手失败
      #   2) 防火墙/安全组需放行 21 端口与整个被动端口段
      #   3) 公网 FTP 为明文传输，务必使用强密码，并尽量限制来源 IP
      - key: FTP_HOST
        sync: false
      - key: FTP_PORT
        sync: false
      - key: FTP_USERNAME
        sync: false
      - key: FTP_PASSWORD
        sync: false          # 密码：在控制台填写
      - key: FTP_BASE_DIR
        sync: false
