# ============================================================
# Render Blueprint — AI Skill 编排系统
# 使用方法：Render Dashboard → New → Blueprint → 选择本仓库
# 标记 sync: false 的变量不会写进仓库，需在 Render 控制台手动填写
# ============================================================

services:
  - type: web
    name: ai-skill
    runtime: docker
    # starter = 512MB / 0.5 CPU。JVM 参数已按此规格调优（见下方 JAVA_OPTS），
    # 实测 JVM 常驻约 190MB，余下约 320MB 供技能执行的 python3 子进程使用
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true

    envVars:
      # ---------- JVM ----------
      # 按 starter(512MB/0.5CPU) 调优，务必显式设置——Dockerfile 的默认值 -Xmx512m
      # 会占满整个实例，不给 python3 子进程留余量。
      #   MaxMetaspaceSize  限制元空间无上限增长
      #   UseSerialGC       0.5 CPU 上比 G1 开销更低、占用更小
      #   ExitOnOutOfMemoryError  OOM 时直接退出，由 Render 自动重启，避免僵死
      # 换用 2GB 及以上实例时可放宽为 -Xmx1024m。
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"

      # ---------- AI 模型（OpenAI 兼容接口）----------
      - key: AI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: AI_API_KEY
        sync: false          # 密钥：在控制台填写
      - key: AI_MODEL
        sync: false          # 填你账号实际可用的模型名
      - key: AI_TEMPERATURE
        value: "0.7"
      - key: AI_MAX_TOKENS
        value: "16384"
      - key: AI_TIMEOUT
        value: "300000"
      - key: AI_THINK
        value: "false"

      # ---------- 存储 ----------
      # 使用本地文件系统 + 下方挂载的持久化磁盘，不依赖任何外部服务器
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/skills

      # 如需改回外部 FTP：把 STORAGE_TYPE 设为 ftp，删除下方 disk 配置，
      # 并补充 FTP_HOST / FTP_PORT / FTP_USERNAME / FTP_PASSWORD / FTP_BASE_DIR

    # ---------- 持久化磁盘 ----------
    # 注意：持久化磁盘仅付费实例可用；未挂盘时容器文件系统是临时的，
    # 每次重新部署或实例重启都会丢失全部技能数据。
    # 挂盘后该服务无法多实例扩容，且部署时会有短暂停机。
    # 容量后续可以扩，但不能缩，因此先给 1GB（技能多为文本与脚本，占用很小）。
    disk:
      name: skill-data
      mountPath: /var/data
      sizeGB: 1
